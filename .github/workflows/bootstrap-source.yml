name: Bootstrap sanitized Visitor source

on:
  push:
    branches: [main]
    paths:
      - visitor_aligned.zip

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand sanitized source
        shell: bash
        run: |
          set -euo pipefail
          test -f visitor_aligned.zip || exit 0
          rm -rf /tmp/visitor-source
          mkdir -p /tmp/visitor-source
          unzip -q visitor_aligned.zip -d /tmp/visitor-source
          test -d /tmp/visitor-source/visitor
          rsync -a --delete             --exclude='.git/'             --exclude='config.local.php'             --exclude='uploads/faces/*.png'             --exclude='uploads/qr/*'             --exclude='storage/logs/*'             /tmp/visitor-source/visitor/ ./
          rm -f visitor_aligned.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: import aligned Vale Visitor source"
          git push
